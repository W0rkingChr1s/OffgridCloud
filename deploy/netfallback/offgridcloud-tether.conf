# OffgridCloud: a phone tethered over USB is the uplink of last resort.
#
# NetworkManager gives every wired device route metric 100, so a plugged-in
# phone would otherwise beat a known Wi-Fi (600) and quietly push all uploads
# through the mobile data plan. With 700 it only carries traffic while neither
# a cable nor a known Wi-Fi is up. Installed to
# /etc/NetworkManager/conf.d/ by deploy/netfallback/install.sh.
#
# Drivers: ipheth = iPhone, rndis_host / cdc_ncm = Android. cdc_ether is left
# out on purpose: many USB-Ethernet adapters use it as well.
[connection-offgridcloud-tether]
match-device=driver:ipheth,driver:rndis_host,driver:cdc_ncm
ipv4.route-metric=700
ipv6.route-metric=700
