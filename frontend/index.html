<!doctype html>
<html lang="de" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0EA5A4" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OffgridCloud" />
    <title>OffgridCloud</title>
    <script>
      // Apply the stored colour theme before first paint (no dark flash in
      // light mode). Mirrors src/theme.ts — keep the key and logic in sync.
      (function () {
        try {
          var pref = localStorage.getItem("ogc_theme");
          if (pref !== "light" && pref !== "system") return;
          if (!(window.CSS && CSS.supports && CSS.supports("color", "color-mix(in oklab, red, blue)"))) return;
          var light = pref === "light" || window.matchMedia("(prefers-color-scheme: light)").matches;
          if (light) document.documentElement.className = "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- ↑ ↑ ↓ ↓ ← → ← → B A — some things never go out of style. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
