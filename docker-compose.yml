# OffgridCloud als Docker-Container.
#
#   cp .env.example .env      # OGC_SECRET_KEY + Admin-Passwort setzen!
#   docker compose up -d      # http://<host>:8000
#
# Update:  docker compose pull && docker compose up -d   (Daten in ./data bleiben)
# Selbst bauen statt ziehen:  docker compose up -d --build
#
# Image-Tags: latest (neuestes Release), 0.5 / 0.5.0 (fest), main (Entwicklungsstand).
# Multi-Arch: linux/amd64 und linux/arm64 (Raspberry Pi 3/4/5 mit 64-bit-OS).

services:
  offgridcloud:
    image: ghcr.io/w0rkingchr1s/offgridcloud:${OGC_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: offgridcloud
    restart: unless-stopped
    ports:
      - "${OGC_PORT:-8000}:8000"
    env_file: .env
    environment:
      # Pfade im Container — nicht die aus .env.example (./data) übernehmen.
      OGC_DATA_DIR: /data
      OGC_BUFFER_DIR: /data/buffer
    volumes:
      # Datenbank, Status und Medien-Puffer. Auf dem Pi auf die USB-SSD legen,
      # z. B. /mnt/ssd/offgrid:/data
      - ./data:/data

    # --- Optional: Pool – andere Boxen im LAN automatisch finden (mDNS) -------
    # Multicast erreicht das LAN nur im Host-Netz. Dann statt "ports:" oben:
    # network_mode: host

    # --- Optional: eingebauter VPN-Client (WireGuard/OpenVPN) ---------------
    # cap_add: [NET_ADMIN]
    # devices: ["/dev/net/tun"]
